name: ci

# Pull requests run on pull_request; main runs on push. Pushing a branch
# that has a pull request no longer runs everything twice.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  host:
    name: host (${{ matrix.compiler }}, ${{ matrix.build_type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_C_COMPILER=${{ matrix.compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DOC_WERROR=ON
      - name: Build
        run: cmake --build build -j
      - name: Unit and closed-loop tests
        run: ctest --test-dir build --output-on-failure
      - name: Trace of the hoist scenario
        if: matrix.compiler == 'gcc' && matrix.build_type == 'Release'
        run: ./build/open-crank-run scenarios/hoist_step.csv --trace hoist_step_trace.csv
      - name: Upload trace
        if: matrix.compiler == 'gcc' && matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: hoist-step-trace
          path: hoist_step_trace.csv

  readme:
    name: README instructions, verbatim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build and test as the README says
        run: |
          cmake -S . -B build
          cmake --build build
          ctest --test-dir build --output-on-failure
      - name: Headless run as the README says
        run: |
          ./build/open-crank-run scenarios/hoist_step.csv
          ./build/open-crank-run scenarios/overspeed.csv --trace overspeed.csv
          ./build/open-crank-run scenarios/overspeed.csv --trace overspeed.csv --frames overspeed.frames.csv

  sanitizers:
    name: sanitizers (ASan, UBSan, float-cast-overflow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Keep ASan working on kernels with high ASLR entropy
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_BUILD_TYPE=Debug
          -DOC_WERROR=ON
          "-DCMAKE_C_FLAGS=-fsanitize=address,undefined,float-cast-overflow -fno-sanitize-recover=all -fno-omit-frame-pointer"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build -j
      - name: Tests
        run: ctest --test-dir build --output-on-failure

  portable-cortex-m4f:
    name: portable/ on Cortex-M4F
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Cache the pinned Arm GNU toolchain
        uses: actions/cache@v4
        with:
          path: ~/.cache/open-crank
          key: arm-gnu-toolchain-14.2.rel1-${{ runner.os }}-${{ runner.arch }}
      - name: Install the pinned Arm GNU toolchain (14.2.rel1, SHA-256 checked)
        run: tools/board/arm_toolchain.sh >> "$GITHUB_PATH"
      - name: Build for the MCU, check undefined symbols, stack usage and includes
        run: |
          arm-none-eabi-gcc --version | head -1
          tools/check_portable.sh

  firmware:
    name: STM32G4 firmware (CMake, no CubeIDE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache the pinned Arm GNU toolchain
        uses: actions/cache@v4
        with:
          path: ~/.cache/open-crank
          key: arm-gnu-toolchain-14.2.rel1-${{ runner.os }}-${{ runner.arch }}
      - name: Install the pinned Arm GNU toolchain (14.2.rel1, SHA-256 checked)
        run: tools/board/arm_toolchain.sh >> "$GITHUB_PATH"
      - name: Build the demo and the echo (ST's CMSIS and HAL fetched, pinned by SHA-256)
        run: |
          arm-none-eabi-gcc --version | head -1
          cmake -S platforms/stm32g4 -B build-stm32g4 -DCMAKE_TOOLCHAIN_FILE=$PWD/cmake/arm-none-eabi.cmake -DOC_WERROR=ON
          cmake --build build-stm32g4
      - name: No CubeMX-generated code in the firmware
        run: |
          for elf in build-stm32g4/*.elf; do
            if arm-none-eabi-nm "$elf" | grep -E ' (MX_[A-Za-z0-9_]+|SystemClock_Config)$'; then
              echo "FAIL: $elf has CubeMX-generated functions"; exit 1
            fi
          done
          echo "no MX_* or SystemClock_Config symbols"
      - name: The intentional hang exists only in the test build
        run: |
          if arm-none-eabi-nm build-stm32g4/oc-stm32g4-demo.elf | grep -w oc_test_hang; then
            echo "FAIL: the reference firmware has the test hang"; exit 1
          fi
          arm-none-eabi-nm build-stm32g4/oc-stm32g4-demo-hangtest.elf | grep -qw oc_test_hang || {
            echo "FAIL: the hang test build lost its hang, so the check above proves nothing"; exit 1; }
          echo "oc_test_hang only in oc-stm32g4-demo-hangtest.elf"
      - uses: actions/upload-artifact@v4
        with:
          name: stm32g4-firmware
          path: |
            build-stm32g4/*.elf
            build-stm32g4/*.bin
            build-stm32g4/*.map

  misra:
    name: MISRA-oriented check of portable/ (against the baseline)
    # Pinned: the baseline depends on the cppcheck version that apt installs.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cppcheck
      - name: cppcheck MISRA addon, compared with tools/misra-baseline.txt
        run: tools/check_misra.sh
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: misra-report
          path: build/misra-report.txt

  mutation:
    name: mutation sanity (tests can fail)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Break each safety-relevant behaviour; the tests must catch it
        run: tools/mutation_check.sh
      - name: Break each controller behaviour; the acceptance suite must catch it
        run: tools/accept_mutants.sh
      - name: Every safety requirement is checked by a criterion or a test (docs/safety.md)
        run: python3 tools/check_requirements.py

  dbc:
    name: open-crank.dbc agrees with the encoders (cantools)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install cantools (pinned)
        run: python3 -m pip install --user -r tools/requirements-dbc.txt
      - name: Build the vectors
        run: |
          cmake -S . -B build
          cmake --build build -j --target oc-dbc-vectors
      - name: Every signal and period agrees; each DBC mutation is caught
        run: tools/check_dbc.sh build

  traces:
    name: traces unchanged versus the base branch
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          path: head
      - uses: actions/checkout@v4
        with:
          submodules: true
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - name: Build the base and the pull request
        run: |
          for tree in base head; do
            cmake -S "$tree" -B "build-$tree" -DCMAKE_BUILD_TYPE=Release
            cmake --build "build-$tree" -j
          done
      - name: Compare the trace of every scenario, byte for byte
        env:
          BEHAVIOUR_CHANGE: ${{ contains(github.event.pull_request.labels.*.name, 'behaviour-change') }}
        run: head/tools/compare_traces.sh build-base build-head head/scenarios
      - name: Level 2 traces (scenarios/l2, open-crank-l2-run) unchanged versus the base branch
        env:
          BEHAVIOUR_CHANGE: ${{ contains(github.event.pull_request.labels.*.name, 'behaviour-change') }}
        run: RUNNER=open-crank-l2-run head/tools/compare_traces.sh build-base build-head head/scenarios/l2

  wiring:
    name: Level 2 wiring diagrams (WireViz) agree with WIRING-L2.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Graphviz, from the runner's packages (not pinned; the .svg is checked by content)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends graphviz
      - name: Cache the pinned WireViz venv
        uses: actions/cache@v4
        with:
          path: ~/.cache/open-crank/wireviz
          key: wireviz-${{ runner.os }}-${{ hashFiles('tools/wireviz-requirements.lock') }}
      - name: The .gv byte for byte, the .svg by content, every signal against the tables and the .cst
        run: tools/wireviz.sh --check

  vcan-demo:
    name: vcan demo, as the README describes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Set up vcan0
        id: vcan
        run: |
          if ! sudo modprobe vcan 2>/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)" || true
            sudo modprobe vcan || true
          fi
          if sudo ip link add dev vcan0 type vcan && sudo ip link set up vcan0; then
            echo "available=yes" >> "$GITHUB_OUTPUT"
          else
            echo "available=no" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        run: |
          cmake -S . -B build
          cmake --build build -j
      - name: Controller and engine as two processes on vcan0
        if: steps.vcan.outputs.available == 'yes'
        run: tools/vcan_demo_check.sh build vcan0
      - name: Acceptance suite on vcan0
        if: steps.vcan.outputs.available == 'yes'
        run: tools/accept_vcan.sh build vcan0
      - name: Frame log with kernel times on vcan0 (open-crank-accept --frames)
        if: steps.vcan.outputs.available == 'yes'
        run: tools/frames_vcan_check.sh build vcan0
      - name: Report that the demo was not run
        if: steps.vcan.outputs.available != 'yes'
        run: echo "::warning::vcan is not available on this runner; the vcan demo and the acceptance suite were NOT run"
